<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Careers | Bloomtide</title><style>body{margin:0;background:#f7f4ec;color:#18302d;font-family:Arial,sans-serif}.wrap{width:min(1000px,90%);margin:auto}header{padding:28px 0;display:flex;justify-content:space-between}a{color:#123b36}h1,h2,h3{font-family:Georgia,serif}.hero{background:#123b36;color:white;padding:90px 0}.hero h1{font-size:54px}.jobs{padding:70px 0}.job-card{background:white;border:1px solid #d9ddd8;padding:28px;margin:15px 0;display:flex;justify-content:space-between;gap:25px;align-items:center}.job-card span{font-size:11px;text-transform:uppercase;letter-spacing:2px}.job-card h3{font-size:25px;margin:8px 0}.apply-btn,.btn{background:#123b36;color:white;border:0;padding:13px 20px;cursor:pointer}.panel{background:white;padding:30px;margin-top:35px;border:1px solid #d9ddd8}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea{padding:13px;border:1px solid #ccd2ce}.full{grid-column:1/-1}textarea{min-height:120px}.empty{padding:25px;background:white;border:1px solid #d9ddd8}@media(max-width:700px){form{grid-template-columns:1fr}.full{grid-column:auto}.job-card{display:block}.apply-btn{margin-top:15px}}</style></head><body><header class="wrap"><a href="index.html">← Bloomtide</a><a href="index.html#request">Request an Appraisal</a></header><section class="hero"><div class="wrap"><div>CAREERS AT BLOOMTIDE</div><h1>Grow with us.</h1><p>Join a company focused on clarity, professionalism and better real estate valuation experiences.</p></div></section><main class="wrap jobs"><h2>Open positions</h2><div id="jobsList"></div><section id="applyPanel" class="panel" hidden><h2>Apply for <span id="jobTitle"></span></h2><form id="applicationForm"><input id="job_id" name="job_id" type="hidden"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone number"><input name="linkedin_url" placeholder="LinkedIn URL"><input class="full" name="resume_url" placeholder="Resume/CV link"><textarea class="full" name="cover_letter" placeholder="Cover letter / message"></textarea><button class="btn full">Submit application</button></form><div id="applicationStatus"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
