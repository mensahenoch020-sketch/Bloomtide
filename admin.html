<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloomtide Admin</title><style>:root{--f:#123b36;--bg:#f5f4ef;--line:#d8ddd9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#18302d;font-family:Arial,sans-serif}.wrap{width:min(1250px,94%);margin:auto}header{background:#0a2623;color:white;padding:18px 0}header .wrap{display:flex;justify-content:space-between;align-items:center}button{background:var(--f);color:white;border:0;padding:11px 16px;cursor:pointer}h1,h2,h3{font-family:Georgia,serif}.login{max-width:450px;margin:100px auto;background:white;padding:35px;border:1px solid var(--line)}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd1cd}.login form{display:grid;gap:12px}.dashboard{padding:35px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat,.card{background:white;border:1px solid var(--line);padding:24px}.stat b{font-size:34px;color:var(--f)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.card.full{grid-column:1/-1}.jobform{display:grid;grid-template-columns:1fr 1fr;gap:10px}.jobform .full{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3e6e3;vertical-align:top}.fee{width:110px}@media(max-width:900px){.stats,.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.jobform{grid-template-columns:1fr}.jobform .full{grid-column:auto}.tablewrap{overflow:auto}}</style></head><body id="adminApp"><header><div class="wrap"><strong>BLOOMTIDE · ADMIN</strong><div><a href="index.html" style="color:white;margin-right:18px">View site</a><button id="logoutBtn">Sign out</button></div></div></header><section id="loginCard" class="login" hidden><h2>Admin sign in</h2><form id="adminLogin"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><div id="loginStatus"></div></section><main id="dashboard" class="wrap dashboard" hidden><h1>Dashboard</h1><div class="stats"><div class="stat"><span>Appraisal requests</span><br><b id="requestCount">0</b></div><div class="stat"><span>Jobs</span><br><b id="jobCount">0</b></div><div class="stat"><span>Applications</span><br><b id="applicationCount">0</b></div></div><div class="grid"><section class="card full"><h2>Appraisal requests</h2><div class="tablewrap"><table><thead><tr><th>Client</th><th>Property</th><th>Type</th><th>Status</th><th>Fee</th><th></th></tr></thead><tbody id="requestsBody"></tbody></table></div></section><section class="card"><h2>Post a job</h2><form id="jobForm" class="jobform"><input name="title" placeholder="Job title" required><input name="location" placeholder="Location" value="United States"><input name="department" placeholder="Department"><select name="employment_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select><input class="full" name="salary_range" placeholder="Salary/range (optional)"><textarea class="full" name="description" placeholder="Job description" required></textarea><textarea class="full" name="requirements" placeholder="Requirements"></textarea><input name="closing_date" type="date"><label><input name="published" type="checkbox" style="width:auto"> Publish immediately</label><button class="full">Save job</button></form></section><section class="card"><h2>Jobs</h2><div class="tablewrap"><table><thead><tr><th>Title</th><th>Location</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="jobsBody"></tbody></table></div></section><section class="card full"><h2>Job applications</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Job</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody id="applicationsBody"></tbody></table></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
